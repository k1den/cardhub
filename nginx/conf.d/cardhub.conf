upstream app_upstream {
    server app:3000;
    keepalive 32;
}

# Redirect all HTTP traffic to HTTPS (except Let's Encrypt validation)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate configuration
    # In production with Certbot, replace with your domain:
    # ssl_certificate /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern SSL security parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Diffie-Hellman parameter for DHE ciphersuites (optional but recommended)
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # Client upload body limit (5MB per 152-ФЗ / CardHub requirements)
    client_max_body_size 5M;

    # Fast static serving for user uploads directly from volume
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Next.js static assets with immutable cache
    location /_next/static/ {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and Robots
    location = /favicon.ico {
        proxy_pass http://app_upstream;
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://app_upstream;
        expires 1d;
        access_log off;
    }

    # Proxy all application requests to Next.js
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP forwarding (Critical for Rate Limiting & 152-ФЗ logs)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering & Timeouts
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
