services:
  postgres:
    image: postgres:16-alpine
    container_name: cardhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardhub_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cardhub}
    volumes:
      - cardhub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardhub} -d ${POSTGRES_DB:-cardhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardhub-net

  redis:
    image: redis:7-alpine
    container_name: cardhub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cardhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cardhub-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardhub-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cardhub}:${POSTGRES_PASSWORD:-cardhub_secure_pass}@postgres:5432/${POSTGRES_DB:-cardhub}?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - cardhub_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - cardhub-net

  nginx:
    image: nginx:1.25-alpine
    container_name: cardhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - cardhub_uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - cardhub-net

  certbot:
    image: certbot/certbot:latest
    container_name: cardhub-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'
    networks:
      - cardhub-net

volumes:
  cardhub_db_data:
  cardhub_redis_data:
  cardhub_uploads:

networks:
  cardhub-net:
    driver: bridge
